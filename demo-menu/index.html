<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Kasmin Demo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3faf3; color: #14501c; }
        main { width: min(26rem, 90vw); text-align: center; }
        img { height: 3rem; margin-bottom: 1.5rem; }
        a { display: block; margin: 0.75rem 0; padding: 1rem; border-radius: 0.75rem; background: #1da029; color: #fff; font-weight: 600; text-decoration: none; font-size: 1.1rem; }
        a:hover, a:focus { background: #187f22; }
        p { font-size: 0.9rem; }
        p a { display: inline; padding: 0; margin: 0; background: none; color: #14501c; text-decoration: underline; font-weight: normal; font-size: inherit; }
    </style>
</head>
<body>
<main>
    <img src="/logo.svg" alt="Kasmin">
    <a href="https://demo-de.kasmin.org/" lang="de">Demo auf Deutsch</a>
    <a href="https://demo-en.kasmin.org/">Demo in English</a>
    <p><a href="https://www.kasmin.org/">www.kasmin.org</a></p>
</main>
</body>
</html>
